# config.yaml
cluster_name: dynamic-gpu-cluster
min_workers: 1
max_workers: 2
upscaling_speed: 1.0

provider:
  type: aws
  region: us-east-1
  availability_zone: us-east-1a,us-east-1b
  security_group:
    GroupName: ray-autoscaler-dynamic-gpu-cluster
    IpPermissions:
      - FromPort: 0
        ToPort: 65535
        IpProtocol: tcp
        IpRanges:
          - CidrIp: 0.0.0.0/0

auth:
  ssh_user: ubuntu
  ssh_private_key: ray-nodes.pem

head_node_type: ray_head_default

available_node_types:
  ray_head_default:
    node_config:
      InstanceType: t3.xlarge
      ImageId: ami-0261755bbcb8c4a84  # Ubuntu 20.04 LTS AMI for us-east-1
      KeyName: ray-nodes
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 10
    resources: {"CPU": 4}
    min_workers: 0
    max_workers: 0

  ray_worker_default:
    node_config:
      InstanceType: g4dn.xlarge
      ImageId: ami-0261755bbcb8c4a84  # Ubuntu 20.04 LTS AMI for us-east-1
      KeyName: ray-nodes
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 100
    resources: {"CPU": 4, "GPU": 1}
    min_workers: 1
    max_workers: 2

setup_commands:
  - sudo apt-get update -y
  - sudo apt-get install -y python3-venv python3-pip
  - python3 -m venv ~/ray_env
  - |
    source ~/ray_env/bin/activate &&
    pip install --upgrade pip &&
    pip install ray[default] &&
    pip install fastapi uvicorn 
  - |
    cat > ~/setup_ray_env.sh << EOL
    #!/bin/bash
    source ~/ray_env/bin/activate
    export PATH=~/ray_env/bin:$PATH
    EOL
  - chmod +x ~/setup_ray_env.sh
  - echo 'export PATH=~/ray_env/bin:$PATH' >> ~/.bashrc

head_start_ray_commands:
  - bash -c 'source ~/setup_ray_env.sh && ray stop'
  - >
    bash -c '
    source ~/setup_ray_env.sh &&
    ulimit -n 65536 &&
    export RAY_HEAD_EXTERNAL_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4) &&
    export RAY_HEAD_INTERNAL_IP=$(hostname -I | awk "{print \$1}") &&
    ray start --head --port=6379 --object-manager-port=8076 --dashboard-host=0.0.0.0 
    --node-ip-address=$RAY_HEAD_INTERNAL_IP --redis-password="password" 
    --autoscaling-config=~/ray_bootstrap_config.yaml
    '

worker_start_ray_commands:
  - bash -c 'source ~/setup_ray_env.sh && ray stop'
  - >
    bash -c '
    source ~/setup_ray_env.sh &&
    ulimit -n 65536 &&
    export WORKER_INTERNAL_IP=$(hostname -I | awk "{print \$1}") &&
    ray start --address=$RAY_HEAD_IP:6379 --object-manager-port=8076
    --node-ip-address=$WORKER_INTERNAL_IP --redis-password="password"
    '